name: Build ZULVAZA Seller APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app version from Gradle
        id: app_ver
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Detected version v${VERSION_NAME} (Build ${VERSION_CODE}), tag=${RELEASE_TAG}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & install API 36.1
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER_BIN" ] || [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager not found locally; installing Android cmdline-tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "Using preinstalled sdkmanager: $SDKMANAGER_BIN"

          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "$SDK_DIR/licenses/intel-android-extra-license"

          { yes || true; } | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          { yes || true; } | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          { yes || true; } | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true
          ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug.keystore from debug.keystore.base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          mkdir -p release-assets
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          cp "$DEBUG_APK" "release-assets/zulvaza-seller-v${{ steps.app_ver.outputs.version_name }}-debug.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zulvaza-seller-debug-apk
          path: release-assets/*-debug.apk
          if-no-files-found: error

      - name: Check release keystore secrets
        id: check_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Verify Signed Release APK & AAB
        if: steps.check_release.outputs.has_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --console=plain
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -maxdepth 2 -name "*.aab" | head -n 1)
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER_BIN="$SDK_DIR/build-tools/36.0.0/apksigner"
          if [ -n "$RELEASE_APK" ]; then
            if [ -x "$APKSIGNER_BIN" ]; then
              "$APKSIGNER_BIN" verify --print-certs "$RELEASE_APK"
            fi
            cp "$RELEASE_APK" "release-assets/zulvaza-seller-v${{ steps.app_ver.outputs.version_name }}-release.apk"
          fi
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "release-assets/zulvaza-seller-v${{ steps.app_ver.outputs.version_name }}-release.aab"
          fi
          rm -f my-upload-key.jks

      - name: Upload Release APK & AAB Artifacts
        if: steps.check_release.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zulvaza-seller-release-builds
          path: |
            release-assets/*-release.apk
            release-assets/*-release.aab
          if-no-files-found: warn

      - name: Publish GitHub Release (for In-App Updates)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_ver.outputs.release_tag }}
          name: ZULVAZA Seller Center v${{ steps.app_ver.outputs.version_name }} (Build ${{ steps.app_ver.outputs.version_code }})
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Build & Signing Summary
        run: |
          {
            echo "## ZULVAZA Seller Center v${{ steps.app_ver.outputs.version_name }} (Build ${{ steps.app_ver.outputs.version_code }})"
            echo "- **Debug APK**: Signed with \`debug.keystore\`"
            if [ "${{ steps.check_release.outputs.has_release }}" = "true" ]; then
              echo "- **Release APK & AAB**: Signed with your \`upload\` release keystore"
            else
              echo "- **Release APK & AAB**: Skipped (add \`RELEASE_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` in Repository Secrets to sign release builds)"
            fi
            echo "- **Release Tag**: \`${{ steps.app_ver.outputs.release_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
